<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GSNFotos — Publicar</title>
<link rel="manifest" href="manifest.json" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#22223a; --border:#2e2e4a;
    --accent:#c084fc; --accent-solid:#7c3aed; --text:#e8e8f0; --text-muted:#7070a0;
    --success:#34d399; --error:#f87171; --warning:#fbbf24; --radius:14px; --radius-sm:8px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; }
  header { padding:20px; display:flex; align-items:center; gap:12px; }
  .logo { width:36px; height:36px; background:linear-gradient(135deg,var(--accent-solid),#a855f7); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .logo svg { width:20px; height:20px; }
  header h1 { font-size:17px; font-weight:600; }
  header span { font-size:12px; color:var(--text-muted); font-family:'DM Mono',monospace; }
  .btn-drive { margin-left:auto; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:600; padding:8px 14px; border-radius:99px; text-decoration:none; display:flex; align-items:center; gap:6px; transition:border-color .15s, color .15s; }
  .btn-drive:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:0 20px 24px; display:flex; flex-direction:column; gap:16px; max-width:480px; margin:0 auto; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .field-label { font-size:11px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  input[type="text"] { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'DM Mono',monospace; font-size:18px; font-weight:500; letter-spacing:1px; padding:13px 14px; outline:none; text-transform:uppercase; }
  input[type="text"]:focus { border-color:var(--accent); }
  .btn { width:100%; background:linear-gradient(135deg,var(--accent-solid),#a855f7); border:none; border-radius:var(--radius); color:white; font-size:15px; font-weight:600; padding:14px; cursor:pointer; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .produto-codigo { font-family:'DM Mono',monospace; font-size:13px; color:var(--accent); font-weight:600; letter-spacing:0.5px; margin-bottom:4px; }
  .produto-nome { font-size:16px; font-weight:600; margin-bottom:2px; }
  .produto-sub { font-size:12px; color:var(--text-muted); }
  .foto-pool { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:10px; margin-top:14px; }
  .foto-thumb { aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:grab; border:1.5px solid var(--border); position:relative; transition:transform .15s, border-color .15s; }
  .foto-thumb:hover { border-color:var(--accent); transform:scale(1.03); }
  .foto-thumb img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .variacao-slot.filled img { cursor:zoom-in; }
  .foto-thumb.dragging { opacity:0.3; }
  .foto-thumb.usada { opacity:0.35; }
  .foto-thumb.usada::after { content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#00000066; color:var(--success); font-size:20px; font-weight:700; }
  .foto-thumb .badge-capa { position:absolute; top:4px; left:4px; background:var(--accent-solid); color:white; font-size:9px; font-weight:600; padding:2px 6px; border-radius:6px; z-index:2; }
  .variacao-card { display:flex; align-items:center; gap:14px; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:10px; transition:border-color .15s, background .15s; }
  .variacao-card.dragover { border-color:var(--accent); background:#7c3aed22; }
  .variacao-slot { width:64px; height:64px; border-radius:10px; border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; font-size:22px; color:var(--text-muted); position:relative; }
  .variacao-slot.filled { border-style:solid; border-color:var(--success); }
  .variacao-slot img { width:100%; height:100%; object-fit:cover; display:block; }
  .variacao-info { flex:1; min-width:0; }
  .variacao-nome { font-size:14px; font-weight:600; }
  .variacao-status { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .variacao-remover { background:none; border:none; color:var(--error); font-size:18px; cursor:pointer; padding:4px 8px; flex-shrink:0; opacity:0; transition:opacity .15s; }
  .variacao-card:has(.filled) .variacao-remover { opacity:1; }
  .dropzone { border:2px dashed var(--border); border-radius:var(--radius); padding:28px 20px; text-align:center; cursor:pointer; position:relative; transition:border-color .15s, background .15s; }
  .dropzone:hover { border-color:var(--accent); background:#7c3aed11; }
  .dropzone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .dropzone-icon { font-size:32px; margin-bottom:8px; }
  .dropzone-text { font-size:14px; font-weight:500; color:var(--text); }
  .dropzone-sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 18px; font-size:13px; font-weight:500; transition:transform .3s; z-index:200; max-width:90vw; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error { border-color:var(--error); color:var(--error); }
  .log { font-family:'DM Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:10px; display:flex; flex-direction:column; gap:3px; }
  .log-line.ok { color:var(--success); }
  .log-line.err { color:var(--error); }
  .modal-overlay { position:fixed; inset:0; background:#000000aa; display:flex; align-items:center; justify-content:center; z-index:500; padding:20px; }
  .modal-overlay.hidden { display:none; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 20px; max-width:340px; width:100%; text-align:center; }
  .modal-icone { font-size:32px; margin-bottom:10px; }
  .modal-titulo { font-size:16px; font-weight:600; margin-bottom:6px; }
  .modal-mensagem { font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:18px; }
  .modal-btn { background:var(--accent-solid); border:none; color:white; font-size:14px; font-weight:600; padding:10px 24px; border-radius:var(--radius-sm); cursor:pointer; }
  .lightbox-overlay { position:fixed; inset:0; background:#000000dd; display:flex; align-items:center; justify-content:center; z-index:600; padding:24px; }
  .lightbox-overlay.hidden { display:none; }
  .lightbox-img { max-width:100%; max-height:85vh; border-radius:12px; box-shadow:0 20px 60px #00000088; }
  .lightbox-fechar { position:absolute; top:20px; right:20px; background:var(--surface); border:1px solid var(--border); color:white; font-size:20px; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
  <div><h1>GSNFotos</h1><span>Publicar na Bagy</span></div>
  <a href="https://drive.google.com/drive/folders/1VVVFN0QXS_lClJzdlWFVS0FO1zFP49bx?usp=sharing" target="_blank" rel="noopener" class="btn-drive">📁 Drive</a>
</header>

<main>

  <div class="card" id="card-busca">
    <div class="field-label">🏷️ Código do produto (SKU)</div>
    <input type="text" id="sku-input" placeholder="Ex: CO00649" autocomplete="off" onkeydown="if(event.key==='Enter') buscarProduto()" />
    <button class="btn" id="btn-buscar" style="margin-top:12px" onclick="buscarProduto()">🔍 Buscar produto</button>
  </div>

  <div class="card" id="card-produto" style="display:none;">
    <div class="produto-codigo" id="produto-codigo"></div>
    <div class="produto-nome" id="produto-nome"></div>
    <div class="produto-sub" id="produto-sub"></div>
  </div>

  <div class="card" id="card-upload" style="display:none;">
    <div class="field-label">📸 1. Envie todas as fotos do produto</div>
    <div class="dropzone">
      <input type="file" id="file-input" accept="image/*" multiple />
      <div class="dropzone-icon">🖼️</div>
      <div class="dropzone-text">Selecionar fotos</div>
      <div class="dropzone-sub">Toque para abrir a galeria · Múltiplas permitidas</div>
    </div>
    <div class="foto-pool" id="foto-pool"></div>
  </div>

  <div class="card" id="card-variacoes" style="display:none;">
    <div class="field-label">🎨 2. Arraste cada foto para a variação certa</div>
    <div id="variacoes-list"></div>
  </div>

  <button class="btn" id="btn-publicar" style="display:none;" onclick="publicar()">🚀 Publicar na Bagy</button>

  <div class="card" id="card-log" style="display:none;">
    <div class="field-label">✅ Resultado</div>
    <div class="log" id="log"></div>
  </div>

</main>

<div class="modal-overlay hidden" id="modal-overlay" onclick="if(event.target===this) fecharModal()">
  <div class="modal-box">
    <div class="modal-icone">⚠️</div>
    <div class="modal-titulo" id="modal-titulo">Produto não encontrado</div>
    <div class="modal-mensagem" id="modal-mensagem"></div>
    <button class="modal-btn" onclick="fecharModal()">Entendi</button>
  </div>
</div>

<div class="lightbox-overlay hidden" id="lightbox-overlay" onclick="if(event.target===this) fecharLightbox()">
  <button class="lightbox-fechar" onclick="fecharLightbox()">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="Prévia da foto" />
</div>

<div class="toast" id="toast"></div>

<script>
  const BACKEND_URL = 'https://gsnfotos-v3.onrender.com';

  let skuAtual = null;
  let dadosBagy = null;   // { produto: {id, nome, codigo}, variacoes: [{id, codigo, nome, fotoAtual}] }
  let vinculos = {};      // color_id -> foto_url (nova, escolhida pelo usuário)
  let fotosExistentesId = {}; // color_id -> id da imagem já cadastrada na Bagy (se houver)
  let contadorFoto = 0;

  async function buscarProduto() {
    const sku = document.getElementById('sku-input').value.trim();
    if (!sku) return;

    const btn = document.getElementById('btn-buscar');
    btn.disabled = true;
    btn.textContent = 'Buscando...';

    try {
      const res = await fetch(`${BACKEND_URL}/produto/${encodeURIComponent(sku)}`);
      const data = await res.json();

      if (!data.bagy) {
        // Filtra qualquer menção ao Bling — este frontend só
        // trabalha com a Bagy, não faz sentido o usuário ver
        // erro de uma plataforma que nem está em uso aqui.
        const errosBagy = (data.erros || []).filter(e => !e.toLowerCase().includes('bling'));
        throw new Error(errosBagy.join(' ') || 'Produto não encontrado na Bagy.');
      }

      skuAtual = sku;
      dadosBagy = data.bagy;
      vinculos = {};
      fotosExistentesId = {};
      document.getElementById('foto-pool').innerHTML = '';
      contadorFoto = 0;

      document.getElementById('produto-codigo').textContent = (dadosBagy.produto.codigo || sku).toUpperCase();
      document.getElementById('produto-nome').textContent = dadosBagy.produto.nome;

      const totalVariacoes = dadosBagy.variacoes?.length || 0;
      document.getElementById('produto-sub').textContent = totalVariacoes > 0
        ? `${totalVariacoes} variação(ões)`
        : 'Produto simples (sem variações) — foto vai direto nele';

      renderVariacoes();

      document.getElementById('card-produto').style.display = 'block';
      document.getElementById('card-upload').style.display = 'block';
      document.getElementById('card-variacoes').style.display = 'block';
      document.getElementById('btn-publicar').style.display = 'block';
      document.getElementById('card-log').style.display = 'none';

    } catch (e) {
      // Esconde qualquer resultado anterior — evita confusão se o
      // usuário buscar um SKU errado depois de um SKU válido
      document.getElementById('card-produto').style.display = 'none';
      document.getElementById('card-upload').style.display = 'none';
      document.getElementById('card-variacoes').style.display = 'none';
      document.getElementById('btn-publicar').style.display = 'none';
      mostrarModal('Produto não encontrado', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🔍 Buscar produto';
    }
  }

  function abrirLightbox(urlImagem) {
    document.getElementById('lightbox-img').src = urlImagem;
    document.getElementById('lightbox-overlay').classList.remove('hidden');
  }

  function fecharLightbox() {
    document.getElementById('lightbox-overlay').classList.add('hidden');
  }

  function mostrarModal(titulo, mensagem) {
    document.getElementById('modal-titulo').textContent = titulo;
    document.getElementById('modal-mensagem').textContent = mensagem;
    document.getElementById('modal-overlay').classList.remove('hidden');
  }

  function fecharModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function renderVariacoes() {
    const lista = document.getElementById('variacoes-list');
    lista.innerHTML = '';

    const alvos = dadosBagy.variacoes?.length
      ? dadosBagy.variacoes
      : [{ id: dadosBagy.produto.id, codigo: dadosBagy.produto.codigo, nome: 'Produto (sem variação)' }];

    alvos.forEach(v => {
      const row = document.createElement('div');
      row.className = 'variacao-card';
      row.dataset.variacaoId = v.id;

      const temFotoExistente = !!v.fotoAtual;
      if (v.fotoAtualId) fotosExistentesId[v.id] = v.fotoAtualId;
      const slotConteudo = temFotoExistente ? `<img src="${v.fotoAtual}" />` : '＋';
      const statusInicial = temFotoExistente
        ? 'Foto atual (arraste para substituir)'
        : 'Arraste uma foto aqui';

      row.innerHTML = `
        <div class="variacao-slot ${temFotoExistente ? 'filled' : ''}" id="slot-${v.id}">${slotConteudo}</div>
        <div class="variacao-info">
          <div class="variacao-nome">${v.nome || v.codigo}</div>
          <div class="variacao-status" id="status-${v.id}">${statusInicial}</div>
        </div>
        <button class="variacao-remover" onclick="removerFotoDaVariacao('${v.id}')" title="Remover">✕</button>
      `;
      if (temFotoExistente) {
        row.querySelector('.variacao-slot img').addEventListener('click', () => abrirLightbox(v.fotoAtual));
      }
      row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', () => row.classList.remove('dragover'));
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.classList.remove('dragover');
        const fotoUrl = e.dataTransfer.getData('text/foto-url');
        const fotoImg = e.dataTransfer.getData('text/foto-img');
        const fotoId = e.dataTransfer.getData('text/foto-id');
        if (!fotoUrl) return;
        vinculos[v.id] = fotoUrl;
        const slot = document.getElementById(`slot-${v.id}`);
        slot.classList.add('filled');
        slot.innerHTML = `<img src="${fotoImg}" />`;
        slot.querySelector('img').addEventListener('click', () => abrirLightbox(fotoImg));
        document.getElementById(`status-${v.id}`).textContent = 'Foto atribuída';
        marcarFotoComoUsada(fotoId);
      });
      lista.appendChild(row);
    });
  }

  function removerFotoDaVariacao(variacaoId) {
    delete vinculos[variacaoId];
    const slot = document.getElementById(`slot-${variacaoId}`);
    slot.classList.remove('filled');
    slot.innerHTML = '＋';
    document.getElementById(`status-${variacaoId}`).textContent = 'Arraste uma foto aqui';
    atualizarUsoDasFotos();
  }

  function marcarFotoComoUsada(fotoId) {
    if (!fotoId) return;
    const el = document.getElementById(`foto-${fotoId}`);
    if (el) el.classList.add('usada');
  }

  function atualizarUsoDasFotos() {
    const emUso = new Set(Object.values(vinculos));
    document.querySelectorAll('.foto-thumb').forEach(el => {
      el.classList.toggle('usada', emUso.has(el.dataset.url));
    });
  }

  document.getElementById('file-input').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    if (!files.length || !skuAtual) return;

    const form = new FormData();
    form.append('sku', skuAtual);
    files.forEach(f => form.append('fotos', f));

    showToast('Enviando fotos...', 'success');

    try {
      const res = await fetch(`${BACKEND_URL}/upload-temporario`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      data.fotos.forEach((foto, i) => {
        const localUrl = URL.createObjectURL(files[i]);
        adicionarFotoNoPool(foto.url, localUrl);
      });
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  function adicionarFotoNoPool(urlPublica, urlLocal) {
    const fotoId = `f${++contadorFoto}`;
    const pool = document.getElementById('foto-pool');
    const ehPrimeira = pool.children.length === 0;
    const thumb = document.createElement('div');
    thumb.className = 'foto-thumb';
    thumb.id = `foto-${fotoId}`;
    thumb.dataset.url = urlPublica;
    thumb.draggable = true;
    thumb.innerHTML = `${ehPrimeira ? '<span class="badge-capa">capa</span>' : ''}<img src="${urlLocal}" />`;
    thumb.querySelector('img').addEventListener('click', e => {
      e.stopPropagation();
      abrirLightbox(urlLocal);
    });
    thumb.addEventListener('dragstart', e => {
      thumb.classList.add('dragging');
      e.dataTransfer.setData('text/foto-url', urlPublica);
      e.dataTransfer.setData('text/foto-img', urlLocal);
      e.dataTransfer.setData('text/foto-id', fotoId);
    });
    thumb.addEventListener('dragend', () => thumb.classList.remove('dragging'));
    pool.appendChild(thumb);
  }

  async function publicar() {
    // A Bagy precisa do ID do produto junto com o color_id (a
    // variação em si não tem um ID isolado do lado da API deles)
    // Quando a variação é "id: null" (produto simples, sem cor),
    // o JS transforma isso na chave de string "null" dentro do
    // objeto — convertemos de volta para null de verdade aqui,
    // senão o backend recebe a string "null" por engano.
    const bagy = Object.entries(vinculos).map(([color_id, foto_url]) => ({
      produto_id: dadosBagy?.produto?.id,
      color_id: color_id === 'null' ? null : color_id,
      foto_url,
      imagem_existente_id: fotosExistentesId[color_id] || null,
    }));

    if (!bagy.length) {
      showToast('Vincule ao menos uma foto antes de publicar.', 'error');
      return;
    }

    const btn = document.getElementById('btn-publicar');
    btn.disabled = true;
    btn.textContent = '⏳ Publicando...';

    try {
      const res = await fetch(`${BACKEND_URL}/publicar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bagy }),
      });
      const data = await res.json();

      mostrarLog(data.resultados?.bagy || []);
      showToast('Publicação concluída — veja o resultado abaixo', 'success');

    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 Publicar na Bagy';
    }
  }

  function mostrarLog(resultadosBagy) {
    const card = document.getElementById('card-log');
    const log = document.getElementById('log');
    log.innerHTML = '';
    card.style.display = 'block';

    resultadosBagy.forEach(r => {
      const linha = document.createElement('div');
      const ok = !r.error;
      linha.className = `log-line ${ok ? 'ok' : 'err'}`;
      linha.textContent = ok ? `✓ publicado com sucesso` : `✗ ${r.error}`;
      log.appendChild(linha);
    });
  }

  let toastTimer;
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
  }
</script>

</body>
</html>
